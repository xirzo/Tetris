name: Build
on: 
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev
      
      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          version: "latest"

      - name: Build Game (Windows)
        if: runner.os == 'Windows'
        run: odin build cmd/release -out:x86_64-windows-tetris.exe -target:windows_amd64 -collection:game=.
        
      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: x86_64-windows-tetris.exe

      - name: Build Game (Linux)
        if: runner.os == 'Linux'
        run: odin build cmd/release -out:x86_64-linux-tetris -target:linux_amd64 -collection:game=.
        
      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: x86_64-linux-tetris

      - name: Build Game (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: odin build cmd/release -out:arm64-macos-tetris -target:darwin_arm64 -collection:game=.
        
      - name: Build Game (macOS Intel)
        if: runner.os == 'macOS'
        run: odin build cmd/release -out:x86_64-macos-tetris -target:darwin_amd64 -collection:game=.

      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            arm64-macos-tetris
            x86_64-macos-tetris
  release:
      name: Create GitHub Release
      needs: build
      if: startsWith(github.ref, 'refs/tags/')
      runs-on: ubuntu-latest
      permissions:
        contents: write
      
      steps:
        - name: Download all built artifacts
          uses: actions/download-artifact@v4
          with:
            path: out-binaries
            merge-multiple: true

        - name: Publish Release
          uses: softprops/action-gh-release@v2
          with:
            files: out-binaries/*
            generate_release_notes: true
